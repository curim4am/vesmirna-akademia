<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#060812">
  <title>🚀 Vesmírná akademie</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>">
</head>
<body>

  <!-- Hvězdné pozadí (kreslí se jen jednou, výkonově nenáročné) -->
  <canvas id="starfield" aria-hidden="true"></canvas>
  <div class="nebula-glow" aria-hidden="true"></div>

  <!-- Horní lišta -->
  <header class="topbar" id="topbar">
    <button class="topbar__back" id="btnBack" aria-label="Zpět">←</button>
    <div class="topbar__title" id="topbarTitle">VESMÍRNÁ AKADEMIE</div>
    <div class="topbar__xp" id="topbarXp"><span id="topbarXpValue">0</span> XP</div>
  </header>

  <!-- Ukazatel průběhu lekce -->
  <div class="progress" id="progress" hidden>
    <div class="progress__fill" id="progressFill"></div>
  </div>

  <!-- Sem se vykreslují všechny obrazovky -->
  <main id="app"></main>

  <!-- Vrstva pro odznaky / oznámení -->
  <div id="overlay" class="overlay" hidden></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <!-- Data (obsah) -->
  <script src="data/images.js"></script>
  <script src="data/objects.js"></script>
  <script src="data/facts.js"></script>
  <script src="data/terms.js"></script>
  <script src="data/sims.js"></script>
  <script src="data/sky.js"></script>
  <script src="data/lessons.js"></script>
  <!-- Aplikace (logika) -->
  <script src="icons.js"></script>
  <script src="sky-map.js"></script>
  <script src="sim-engine.js"></script>
  <script src="app.js"></script>
</body>
</html>
